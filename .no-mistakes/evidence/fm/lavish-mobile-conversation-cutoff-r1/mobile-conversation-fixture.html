<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile conversation review fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: Georgia, serif; background: #fffbf3; color: #17130a; }
    h1 { margin: 0 0 12px; font-size: 32px; }
    .lede { color: #625c50; font-size: 17px; }
    section { border: 1px solid #e8e1cf; border-radius: 12px; padding: 16px; margin: 16px 0; background: #fff; }
    h2 { margin: 0 0 8px; font-size: 19px; }
    p { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Checkout redesign</h1>
  <p class="lede">Review the simplified three-step checkout flow.</p>
  <section><h2>Step 1</h2><p>Autofill the address from the browser profile.</p></section>
  <section><h2>Step 2</h2><p>Card, Apple Pay, and Link.</p></section>
  <section><h2>Step 3</h2><p>Review the order before paying.</p></section>
  <section><h2>Open questions</h2><p>Do we keep guest checkout?</p></section>
</body>
</html>
